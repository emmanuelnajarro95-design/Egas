name: Build JE2BE Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Build JE2BE Android ARM64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate and extract uploaded project ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 2 -type f -name 'je2be-android-visual-y-compilacion.zip' -print -quit)"
          if [ -z "$ZIP" ]; then
            echo "No se encontró je2be-android-visual-y-compilacion.zip en el repositorio."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/je2be-project"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/je2be-project"
          PROJECT_ROOT="$(find "$RUNNER_TEMP/je2be-project" -type f \( -name settings.gradle.kts -o -name settings.gradle \) -printf '%h\n' | head -n 1)"
          if [ -z "$PROJECT_ROOT" ]; then
            echo "El ZIP no contiene settings.gradle.kts ni settings.gradle."
            find "$RUNNER_TEMP/je2be-project" -maxdepth 3 -type f | head -n 80
            exit 1
          fi
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "Proyecto encontrado en: $PROJECT_ROOT"

      - name: Show Kotlin compile context
        shell: bash
        run: |
          set -euo pipefail
          echo "===== ConvertWorker.kt ====="
          nl -ba "$PROJECT_ROOT/app/src/main/java/app/je2be/android/ConvertWorker.kt" | sed -n '55,110p'
          echo "===== MainActivity.kt ====="
          nl -ba "$PROJECT_ROOT/app/src/main/java/app/je2be/android/MainActivity.kt" | sed -n '425,465p'
          echo "===== ConvertWorker.kt start ====="
          nl -ba "$PROJECT_ROOT/app/src/main/java/app/je2be/android/ConvertWorker.kt" | sed -n '1,58p'
          echo "===== MainActivity enqueue and JobCard call sites ====="
          grep -n -E 'JobCard\(|OneTimeWorkRequestBuilder|ConvertWorker|inputData' "$PROJECT_ROOT/app/src/main/java/app/je2be/android/MainActivity.kt" | head -n 100
          echo "===== MainActivity around worker enqueue ====="
          nl -ba "$PROJECT_ROOT/app/src/main/java/app/je2be/android/MainActivity.kt" | sed -n '100,235p'
          exit 1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.3.11579264" \
            "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build JE2BE Android and native engine
        working-directory: ${{ env.PROJECT_ROOT }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK and native ARM64 engine
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_ROOT/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libje2be_jni.so'
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JE2BE-Android-ARM64-debug
          path: ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
