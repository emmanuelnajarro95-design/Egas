name: Build JE2BE Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Build JE2BE Android ARM64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate and extract uploaded project ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 2 -type f -name 'je2be-android-visual-y-compilacion.zip' -print -quit)"
          if [ -z "$ZIP" ]; then
            echo "No se encontró je2be-android-visual-y-compilacion.zip en el repositorio."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/je2be-project"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/je2be-project"
          PROJECT_ROOT="$(find "$RUNNER_TEMP/je2be-project" -type f \( -name settings.gradle.kts -o -name settings.gradle \) -printf '%h\n' | head -n 1)"
          if [ -z "$PROJECT_ROOT" ]; then
            echo "El ZIP no contiene settings.gradle.kts ni settings.gradle."
            find "$RUNNER_TEMP/je2be-project" -maxdepth 3 -type f | head -n 80
            exit 1
          fi
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "Proyecto encontrado en: $PROJECT_ROOT"

      - name: Patch Android worker and job metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path(__import__("os").environ["PROJECT_ROOT"])
          worker = root / "app/src/main/java/app/je2be/android/ConvertWorker.kt"
          activity = root / "app/src/main/java/app/je2be/android/MainActivity.kt"

          worker_text = worker.read_text(encoding="utf-8")
          old_worker = "val nativeHandle = Native.newJob()\n        try {"
          new_worker = "val nativeHandle = Native.newJob()\n        return try {"
          if old_worker not in worker_text:
              raise SystemExit("No se encontró el bloque esperado en ConvertWorker.kt")
          worker.write_text(worker_text.replace(old_worker, new_worker, 1), encoding="utf-8")

          activity_text = activity.read_text(encoding="utf-8")
          old_name = 'val name = info.inputData.getString(ConvertWorker.KEY_INPUT_NAME) ?: "Mundo"'
          new_name = 'val name = info.tags.firstOrNull { it.startsWith("je2be-name:") }?.substringAfter("je2be-name:") ?: "Mundo"'
          old_mode = 'val modeId = info.inputData.getInt(ConvertWorker.KEY_MODE, 0)'
          new_mode = 'val modeId = info.tags.firstOrNull { it.startsWith("je2be-mode:") }?.substringAfter("je2be-mode:")?.toIntOrNull() ?: 0'
          old_tag = ".addTag(ConvertWorker.TAG)"
          new_tag = old_tag + '\n                            .addTag("je2be-name:${source.name}")\n                            .addTag("je2be-mode:$mode")'

          for old, new, label in [
              (old_name, new_name, "nombre del mundo"),
              (old_mode, new_mode, "modo de conversión"),
              (old_tag, new_tag, "etiquetas de la solicitud"),
          ]:
              if old not in activity_text:
                  raise SystemExit(f"No se encontró el código esperado para {label} en MainActivity.kt")
              activity_text = activity_text.replace(old, new, 1)

          activity.write_text(activity_text, encoding="utf-8")

          import re
          cmake_candidates = []
          for cmake in root.rglob("CMakeLists.txt"):
              cmake_text = cmake.read_text(encoding="utf-8")
              if re.search(r"add_library\s*\(\s*je2be_jni\b", cmake_text):
                  marker = "target_compile_options(je2be_jni PRIVATE -Wno-error=sign-compare -Wno-error=unused-variable -Wno-error=delete-non-abstract-non-virtual-dtor)"
                  if marker not in cmake_text:
                      cmake_text += "\n\n" + marker + "\n"
                      cmake.write_text(cmake_text, encoding="utf-8")
                  cmake_candidates.append(str(cmake))
          if not cmake_candidates:
              raise SystemExit("No se encontró el CMakeLists que declara je2be_jni.")
          print("Opciones de warnings C++ aplicadas en:", ", ".join(cmake_candidates))
          print("Correcciones Kotlin y CMake aplicadas.")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.3.11579264" \
            "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build JE2BE Android and native engine
        working-directory: ${{ env.PROJECT_ROOT }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK and native ARM64 engine
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_ROOT/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libje2be_jni.so'
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JE2BE-Android-ARM64-debug
          path: ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
